; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
board_build.flash_mode = dout
board_build.partitions = huge_app.csv
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; ---------- 引脚定义 ----------
    -DPIN_LED_STATUS=12
    -DPIN_LED_DATA=13
    -DPIN_BUTTON=9
    -DLED_ACTIVE_HIGH=true
    -DBUTTON_ACTIVE_LOW=true
    ; ---------- 时序 / 指示灯参数 ----------
    -DBOOT_WINDOW_MS=2000
    -DLED_SCAN_BLINK_MS=200
    -DLED_WIFI_SLOW_BLINK_MS=2000
    -DLED_ADV_DB_FLASH_MS=100
    -DLED_ADV_DB_GAP_MS=1500
monitor_speed = 115200
monitor_filters = 
    time
    send_on_enter
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.0

; 编译前自动将 HTML 嵌入为 C 头文件
extra_scripts = pre:tools/pre_build.py