<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLE Dongle 配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:20px;max-width:720px;margin:0 auto}
h1{text-align:center;color:#1a73e8;font-size:22px;margin:16px 0 20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{font-size:17px;margin-bottom:14px;color:#333;padding-bottom:8px;border-bottom:1px solid #eee}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-group{flex:1;min-width:140px}
.form-group label{display:block;font-size:13px;margin-bottom:4px;color:#666;font-weight:500}
.form-group input,.form-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fafafa;transition:border .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1a73e8;background:#fff}
.hint{font-size:11px;color:#999;margin-top:3px}
.btn{padding:9px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;color:#fff;transition:background .2s;display:inline-block}
.btn-primary{background:#1a73e8}
.btn-primary:hover{background:#1557b0}
.btn-success{background:#34a853}
.btn-success:hover{background:#2d9249}
.btn-danger{background:#ea4335}
.btn-danger:hover{background:#c5221f}
.btn-sm{padding:6px 12px;font-size:12px}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #eee}
th{color:#888;font-weight:600;font-size:13px}
tr:hover{background:#f8f9fa}
.empty{color:#aaa;text-align:center;padding:24px;font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;font-weight:500}
.t0{background:#1a73e8}
.t1{background:#34a853}
.t2{background:#f9ab00;color:#333}
.status-bar{display:flex;justify-content:space-between;align-items:center;background:#e8f0fe;padding:10px 16px;border-radius:8px;margin-bottom:14px;font-size:13px}
.status-bar .v{color:#1a73e8;font-weight:600}
</style>
</head>
<body>
<h1>🔧 BLE Dongle 配置</h1>

<div class="card">
  <h2>📡 BLE 扫描参数</h2>
  <div class="form-row">
    <div class="form-group">
      <label>扫描间隔 (0.625ms)</label>
      <input type="number" id="scanInterval" value="100" min="4" max="16384">
      <div class="hint">值越小扫描越密集，默认 100 (≈62.5ms)</div>
    </div>
    <div class="form-group">
      <label>扫描窗口 (0.625ms)</label>
      <input type="number" id="scanWindow" value="99" min="4" max="16384">
      <div class="hint">≤ 扫描间隔，默认 99 (≈61.9ms)</div>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>扫描类型</label>
      <select id="scanType">
        <option value="0">被动扫描</option>
        <option value="1" selected>主动扫描（可获取设备名）</option>
      </select>
    </div>
    <div class="form-group">
      <label>过滤重复广播</label>
      <select id="scanDuplicate">
        <option value="0" selected>不过滤（显示所有）</option>
        <option value="1">过滤重复</option>
      </select>
    </div>
    <div class="form-group" style="min-width:100px">
      <label>扩展广播</label>
      <select id="extScan">
        <option value="0" selected>关闭</option>
        <option value="1">开启</option>
      </select>
      <div class="hint">BLE 5.0 扩展广播（数据量更大）</div>
    </div>
  </div>
  </div>
</div>

<div class="card">
  <h2>📋 白名单规则</h2>
  <div class="form-row">
    <div class="form-group" style="flex:0.7">
      <label>类型</label>
      <select id="filterType">
        <option value="0">MAC 地址</option>
        <option value="1">广播名称</option>
        <option value="2">厂商 ID</option>
      </select>
    </div>
    <!-- "值" 输入框：MAC 和 名称 共用，选中厂商ID时隐藏 -->
    <div class="form-group" id="valueGroup" style="flex:1.3">
      <label>值</label>
      <input type="text" id="filterValue" placeholder="AA:BB:CC:DD:EE:FF">
    </div>
    <!-- 厂商 ID 输入框：选中厂商ID时显示，只填十六进制，如 0059 -->
    <div class="form-group" id="companyIdGroup" style="display:none;flex:0.8">
      <label>厂商 ID（十六进制）</label>
      <input type="text" id="companyId" placeholder="例: 0059 或 4C00" maxlength="6">
      <div class="hint">只对比前 2 字节（一个 hex 值），如 0059、4C00</div>
    </div>
  </div>
  <div class="action-bar">
    <button class="btn btn-primary" onclick="addEntry()">➕ 添加规则</button>
  </div>
  <table>
    <thead><tr><th>类型</th><th>值</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="whitelistTable">
      <tr><td colspan="4" class="empty">暂无白名单规则</td></tr>
    </tbody>
  </table>
  <div class="action-bar">
    <button class="btn btn-success" onclick="saveAll()">💾 保存全部</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑 清空</button>
    <button class="btn btn-danger" onclick="reboot()">🔄 重启设备</button>
  </div>
</div>

<script>
// ========== 状态 ==========
var currentConfig = [];

// ========== 初始化 ==========
function loadConfig() {
  fetch('/api/config').then(function(r){return r.json()}).then(function(data){
    currentConfig = data.whitelist || [];
    renderTable();
    // 回填扫描参数
    var sp = data.scanParams || {};
    document.getElementById('scanInterval').value = sp.scanInterval || 100;
    document.getElementById('scanWindow').value = sp.scanWindow || 99;
    document.getElementById('scanType').value = sp.scanType || 1;
    document.getElementById('scanDuplicate').value = sp.scanDuplicate ? 1 : 0;
    document.getElementById('extScan').value = sp.extScanEnabled ? 1 : 0;
  });
}

// ========== 白名单渲染 ==========
function renderTable() {
  var tbody = document.getElementById('whitelistTable');
  if (!currentConfig.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无白名单规则</td></tr>';
    return;
  }
  var labels = ['MAC','名称','厂商'];
  var classes = ['t0','t1','t2'];
  var html = '';
  for (var i = 0; i < currentConfig.length; i++) {
    var e = currentConfig[i];
    var val = e.type === 2 ? '0x' + ('0000' + e.companyId.toString(16).toUpperCase()).slice(-4) : e.value;
    html += '<tr><td><span class="tag ' + (classes[e.type]||'') + '">' + (labels[e.type]||'') + '</span></td>' +
            '<td>' + val + '</td>' +
            '<td>' + (e.enabled ? '✅' : '❌') + '</td>' +
            '<td><button class="btn btn-danger btn-sm" onclick="deleteEntry(' + i + ')">删除</button></td></tr>';
  }
  tbody.innerHTML = html;
}

// ========== 白名单操作 ==========
function addEntry() {
  var type = parseInt(document.getElementById('filterType').value);
  var value = document.getElementById('filterValue').value.trim();
  var companyIdHex = document.getElementById('companyId').value.trim();

  if (type === 2) {
    // 厂商 ID 模式：只取 companyId，用十六进制
    if (!companyIdHex) { alert('请输入厂商 ID（十六进制，如 0059）'); return; }
    var companyId = parseInt(companyIdHex, 16);
    if (isNaN(companyId) || companyId < 0 || companyId > 65535) {
      alert('请输入有效的十六进制厂商 ID（0000 ~ FFFF）'); return;
    }
    currentConfig.push({type:type, value:"", companyId:companyId, enabled:true});
  } else {
    // MAC 或 名称 模式
    if (!value) { alert('请输入值'); return; }
    currentConfig.push({type:type, value:value, companyId:0, enabled:true});
  }
  renderTable();
  document.getElementById('filterValue').value = '';
  document.getElementById('companyId').value = '';
}

function deleteEntry(idx) {
  currentConfig.splice(idx, 1);
  renderTable();
}

function saveAll() {
  var sp = {
    scanInterval: parseInt(document.getElementById('scanInterval').value) || 100,
    scanWindow: parseInt(document.getElementById('scanWindow').value) || 99,
    scanType: parseInt(document.getElementById('scanType').value) || 1,
    scanDuplicate: document.getElementById('scanDuplicate').value === '1',
    extScanEnabled: document.getElementById('extScan').value === '1',
    ownAddrType: 0,
    scanFilterPolicy: 0
  };
  var payload = {
    whitelist: currentConfig,
    scanParams: sp
  };
  fetch('/api/config', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).then(function(r){return r.json()}).then(function(d){
    alert(d.message || '保存成功');
  });
}

function clearAll() {
  if (!confirm('确定清空所有规则？')) return;
  fetch('/api/config',{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){
    alert(d.message || '已清空');
    loadConfig();
  });
}

// ========== 类型切换 ==========
document.getElementById('filterType').addEventListener('change', function(){
  var val = this.value;
  var input = document.getElementById('filterValue');
  if (val === '2') {
    document.getElementById('companyIdGroup').style.display = 'block';
    document.getElementById('valueGroup').style.display = 'none';
  } else {
    document.getElementById('companyIdGroup').style.display = 'none';
    document.getElementById('valueGroup').style.display = 'block';
    input.placeholder = val === '0' ? 'AA:BB:CC:DD:EE:FF' : '广播名称';
  }
});

// ========== 重启 ==========
function reboot() {
  if (!confirm('确定重启设备？')) return;
  fetch('/api/reboot',{method:'POST'});
  alert('设备正在重启...');
}

// 启动
loadConfig();
</script>
</body>
</html>
